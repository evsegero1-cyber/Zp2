name: Сборка APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Поиск проекта
        run: |
          if [ ! -f capacitor.config.json ]; then
            for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d _app; done
          fi
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ]; then echo "Загрузите zarplata.zip"; exit 1; fi
          echo "PROJ=$(realpath "$(dirname "$CFG")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Подготовка
        run: |
          cd "$PROJ"
          npm install --no-audit --no-fund
          npm test
          npm run build
          rm -rf android
          npx cap add android
          node scripts/android-icons.js
          npx cap sync android
      - name: Ключ подписи
        run: mkdir -p ~/.android && cp "$PROJ/keystore/debug.keystore" ~/.android/debug.keystore
      - name: Сборка APK
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/zarplata-komplektovshchika.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: zarplata-apk
          path: zarplata-komplektovshchika.apk
