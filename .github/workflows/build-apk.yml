name: Сборка APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Поиск проекта (папка или загруженный zip-архив)
        run: |
          if [ ! -f capacitor.config.json ]; then
            for f in *.zip; do [ -f "$f" ] && unzip -q -o "$f" -d _app; done
          fi
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ]; then echo "Не найден проект. Загрузите в репозиторий файл zarplata.zip"; exit 1; fi
          echo "PROJ=$(realpath "$(dirname "$CFG")")" >> "$GITHUB_ENV"
          echo "Проект: $(dirname "$CFG")"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Лицензии Android SDK (SDK уже установлен на сервере GitHub)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Сборка веб-части и Android-проекта
        env:
          # Ключи Firebase из Secrets репозитория (без них приложение собирается без облака, как раньше)
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          cd "$PROJ"
          npm install --no-audit --no-fund
          npm test
          npm run build
          rm -rf android
          npx cap add android
          node scripts/android-icons.js
          npx cap sync android

      - name: Постоянный ключ подписи (обновления ставятся поверх без потери данных)
        run: mkdir -p ~/.android && cp "$PROJ/keystore/debug.keystore" ~/.android/debug.keystore

      - name: Сборка APK
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          # Gradle скачивается с GitHub — при временном сбое сети пробуем ещё раз (до 4 попыток)
          for i in 1 2 3 4; do ./gradlew --version --no-daemon > /dev/null && break; echo "Повтор загрузки Gradle ($i)…"; sleep $((i * 15)); done
          ./gradlew assembleDebug --no-daemon || (sleep 20 && ./gradlew assembleDebug --no-daemon)
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/zarplata-komplektovshchika.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: zarplata-apk
          path: zarplata-komplektovshchika.apk
